# Render Blueprint Infrastructure-as-Code Specification for BlueLedger
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: blueledger-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend ci
    startCommand: node database/migrate.js && npm --prefix backend start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://blueledger-sigma.vercel.app
      - key: CHAIN_MODE
        value: local
      - key: ALLOW_LOCAL_CHAIN
        value: "1"
      - key: IPFS_PROVIDER
        value: none
      - key: MALWARE_SCAN
        value: optional
      - key: EVIDENCE_ENCRYPTION
        value: "off"
      - key: MAX_UPLOAD_MB
        value: "25"
