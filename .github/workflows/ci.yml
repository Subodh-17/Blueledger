name: CI Pipeline — SIH25038 Blue Carbon MRV

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  contracts:
    name: Smart Contracts & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json

      - name: Install Blockchain Dependencies
        run: npm ci

      - name: Compile Solidity Contracts
        run: npx hardhat compile

      - name: Run Smart Contract Test Suite
        run: npx hardhat test

  backend:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blue_carbon_mrv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend & Root Dependencies
        run: |
          npm --prefix blockchain ci
          npm --prefix backend ci

      - name: Execute Full Backend Test Suite
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: blue_carbon_mrv_test
          DB_USER: postgres
          DB_PASSWORD: testpassword123
          JWT_SECRET: ci-test-secret-never-use-in-production-12345
        run: |
          npm --prefix backend test

  frontend:
    name: Frontend Lint & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Frontend Static Integrity Verification
        run: node scripts/check-frontend.js

  android:
    name: Android Field App Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets
        run: |
          echo "Scanning for sensitive keys or leaked credentials..."
          ! grep -rE --exclude-dir={.git,node_modules,temp,scratch} "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" .
          ! grep -rE --exclude-dir={.git,node_modules,temp,scratch} "xprv[a-zA-Z0-9]{107}" .
